syntax="proto3";

message Person{
    int32 id=1;
    string name=2;
}

message People{
    repeated Person people=1;
}

message Role{
    int32 id=1;
    string userId=2;
    string guildId=3;
    int32 exp=4;
    string date=5;
    optional string training = 6;
    repeated int32 spiritRoots = 7; // 複數靈根，對應 SpiritRootType enum
    int32 reputation = 8; // 名聲
    int32 resources = 9; // 資源
    repeated string backpack = 10; // 背包，存放道具ID
    map<string, string> equipment = 11; // 裝備欄，key為部位，value為道具ID或空字串
    int32 hp = 12; // 當前血量
    int32 mp = 13; // 當前法力
}

message Users{
    repeated Role role=1;
}

message QuestBoard{
    repeated Quest quest=1;
}

message Quest{
    int32 id=1;
    string questId=2;
    string type=3;
    string title=4;
    string desc=5;
    repeated QuestOptions options=6;
}

message QuestOptions{
    string ansId=1;
    string desc=2;
    int32 score=3;
}